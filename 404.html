<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found | Aya Briksine</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <style>
        :root { --bg: #f6f7fb; --text: #15171c; --muted: #5b6270; --accent: #4f46e5; --border: #d9dce5; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0f1115; --text: #eceef3; --muted: #9aa1b0; --accent: #818cf8; --border: #2a2e38; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 2rem 1.2rem; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
        h1 { font-size: clamp(4.5rem, 16vw, 9rem); line-height: 1; margin: 0 0 0.3rem; color: var(--accent); }
        h2 { margin: 0 0 0.6rem; font-size: 1.5rem; }
        p { color: var(--muted); max-width: 32rem; margin: 0 auto 1.5rem; line-height: 1.55; }
        .links { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; }
        a { padding: 0.65rem 1.2rem; border-radius: 999px; border: 1px solid var(--border); color: var(--text); text-decoration: none; font-weight: 600; }
        a.main { background: var(--accent); border-color: var(--accent); color: #fff; }
        a:hover { border-color: var(--accent); }
    </style>
</head>
<body>
    <main>
        <h1>404</h1>
        <h2>This page does not exist</h2>
        <p>The link may be old or mistyped. You can go back to the portfolio or see the robotics projects.</p>
        <div class="links">
            <a class="main" href="/">Back to the portfolio</a>
            <a href="/#projects">See the projects</a>
        </div>
    </main>
</body>
</html>
